name: Publish Deutsch ist einfach! Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      analytics_mode:
        description: Browser tracking mode compiled into the image
        type: choice
        required: true
        default: off
        options:
          - off
          - new
          - legacy

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend CI
        run: npm run ci

  publish-image:
    name: publish-image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=sha,prefix=sha-,suffix=-${{ inputs.analytics_mode || 'off' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_TELEGRAM_BOT_URL=https://t.me/Deine_Deutsch_Quiz_bot
            NEXT_PUBLIC_TELEGRAM_CHANNEL_URL=https://t.me/doechkurse
            NEXT_PUBLIC_DEUTSCH_TRAINER_BOT_URL=https://t.me/Trainer1512_bot
            NEXT_PUBLIC_SITE_URL=https://deutschmit.de
            NEXT_PUBLIC_CONTACT_EMAIL=info@deutschmit.de
            NEXT_PUBLIC_WEBSITE_ANALYTICS_MODE=${{ inputs.analytics_mode || 'off' }}
